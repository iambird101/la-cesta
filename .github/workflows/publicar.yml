# Publica la web (GitHub Pages) y, cada lunes, actualiza antes los precios con Open Prices.
name: Publicar web y precios
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Actualizar precios (código postal 28025)
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          OPEN_PRICES_TOKEN: ${{ secrets.OPEN_PRICES_TOKEN }}
        run: python3 herramientas/actualizar_precios.py --cp 28025
      - name: Guardar precios si han cambiado
        if: github.event_name != 'push'
        continue-on-error: true
        run: |
          git config user.name "precios-bot"
          git config user.email "precios-bot@users.noreply.github.com"
          git add precios.json
          if ! git diff --cached --quiet; then
            git commit -m "Precios actualizados"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "Sin cambios en los precios"
          fi
      - name: Preparar el sitio
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY#*/}"
          echo "window.LACESTA={preciosUrl:\"https://${OWNER,,}.github.io/${REPO}/precios.json\"};" > config.js
          mkdir -p _site
          cp -r index.html config.js manifest.webmanifest sw.js icons precios.json productos.csv _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
