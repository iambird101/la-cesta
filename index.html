<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d7a4c">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="La Cesta">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}</style>
<title>La Cesta</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Concepto: un ticket de supermercado vivo. Panel de ajustes arriba, medidor de presupuesto fijo, y tres vistas (menú, lista, comparar). */
:root{
  --bg:#eef2ee; --surface:#ffffff; --ink:#14201a; --muted:#566860; --line:#d3dcd5;
  --leaf:#1d7a4c; --leaf-ink:#ffffff; --tomato:#d93f27; --lemon:#e9b50f; --soft:#e2eae3;
  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1713; --surface:#17221c; --ink:#e8efe9; --muted:#93a59a; --line:#2a3a31;
    --leaf:#4cc38a; --leaf-ink:#06281a; --tomato:#ff7a63; --lemon:#f1c232; --soft:#1f2d25;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1713; --surface:#17221c; --ink:#e8efe9; --muted:#93a59a; --line:#2a3a31;
  --leaf:#4cc38a; --leaf-ink:#06281a; --tomato:#ff7a63; --lemon:#f1c232; --soft:#1f2d25;
  color-scheme:dark;
}

/* ---------- Temas (se activan con data-skin; "light" y "dark" usan data-theme) ---------- */
:root[data-skin="midnight"]{--bg:#000000;--surface:#0d0d10;--ink:#f1f1f3;--muted:#9b9ba5;--line:#26262c;--leaf:#5ee0a0;--leaf-ink:#00281a;--tomato:#ff7b6b;--lemon:#f5c542;--soft:#17171c;color-scheme:dark}
:root[data-skin="sunset"]{--bg:#1b1114;--surface:#29191e;--ink:#fdeee4;--muted:#cdac9f;--line:#472b31;--leaf:#ff9a5c;--leaf-ink:#2b1100;--tomato:#ff6b6b;--lemon:#ffd166;--soft:#34201f;--bgimg:linear-gradient(165deg,#2c1521 0%,#1b1114 48%,#14101f 100%);--f-display:"Fraunces",Georgia,serif;color-scheme:dark}
:root[data-skin="ocean"]{--bg:#0a1b2b;--surface:#11293f;--ink:#e8f4ff;--muted:#93b4d0;--line:#22435f;--leaf:#41c7ee;--leaf-ink:#03202d;--tomato:#ff7f8f;--lemon:#ffd36b;--soft:#173651;--bgimg:radial-gradient(900px 500px at 85% -8%,#16486e 0%,transparent 62%),linear-gradient(#0a1b2b,#07121d);color-scheme:dark}
:root[data-skin="medit"]{--bg:#f5efe0;--surface:#fffdf6;--ink:#14304d;--muted:#5b6f82;--line:#ddd0b0;--leaf:#1c5fbf;--leaf-ink:#ffffff;--tomato:#cf4527;--lemon:#f0b400;--soft:#ece3cc;--bgimg:radial-gradient(circle at 11px 11px,rgba(28,95,191,.13) 2px,transparent 2.6px);--f-display:"Fraunces",Georgia,serif;color-scheme:light}
:root[data-skin="medit"] body{background-size:22px 22px}
:root[data-skin="lavender"]{--bg:#f2edfb;--surface:#ffffff;--ink:#2b1f45;--muted:#6e6188;--line:#dcd1f0;--leaf:#7446d4;--leaf-ink:#ffffff;--tomato:#d3306a;--lemon:#dca400;--soft:#e7ddf8;--bgimg:linear-gradient(180deg,#eae0ff 0%,#f6f2fd 45%);color-scheme:light}
*{box-sizing:border-box}
body{
  background:var(--bg); background-image:var(--bgimg,none); background-attachment:fixed; color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.45;
  padding-block:20px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
}
.app{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
h1{font-size:2.1rem;font-weight:800;letter-spacing:-.02em;line-height:1}
.brand{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.brand p{margin:6px 0 0;color:var(--muted);max-width:46ch}
.brand>div{min-width:0}
.status{font-size:.78rem;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:5px 11px;color:var(--muted);background:var(--surface);white-space:nowrap}
.status.on{color:var(--leaf);border-color:var(--leaf)}
.status.bad{color:var(--tomato);border-color:var(--tomato)}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--leaf);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:14px;grid-template-columns:repeat(2,minmax(0,1fr))}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field.wide{grid-column:1/-1}
.lbl{font-size:.74rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
select,input[type=number],input[type=text]{width:100%;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 12px}
.stepper{display:flex;align-items:center;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--bg);overflow:hidden}
.stepper button{width:48px;height:100%;border:0;background:transparent;font-size:1.3rem}
.stepper button:active{background:var(--soft)}
.stepper output{flex:1;text-align:center;font-family:var(--f-mono);font-weight:500}
.budget-wrap{position:relative}
.budget-wrap input{padding-right:34px;font-family:var(--f-mono)}
.budget-wrap span{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.primary{height:48px;border:0;border-radius:10px;background:var(--leaf);color:var(--leaf-ink);font-weight:600;padding:0 18px}
.primary:active{transform:translateY(1px)}
.ghost{height:38px;border:1px solid var(--line);border-radius:10px;background:transparent;padding:0 12px;font-weight:500}
.meter{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.meter-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.meter-top .amt{font-family:var(--f-mono);font-size:1.35rem;font-weight:500}
.meter-top .of{color:var(--muted);font-family:var(--f-mono);font-size:.9rem}
.bar{height:10px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--leaf)}
.bar.warn>i{background:var(--lemon)} .bar.over>i{background:var(--tomato)}
.meter-note{font-size:.9rem;color:var(--muted)}
.meter-note b{color:var(--ink);font-weight:600}
.meter-note.bad b{color:var(--tomato)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--soft);padding:4px;border-radius:12px}
.tabs button{height:40px;border:0;border-radius:9px;background:transparent;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.days{display:grid;gap:12px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.day-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:12px 16px;border-bottom:1px dashed var(--line);background:var(--soft)}
.day-h h3{font-size:1.05rem;font-weight:800}
.day-h span{font-family:var(--f-mono);font-size:.85rem;color:var(--muted)}
.meal{padding:10px 16px;border-top:1px solid var(--line)}
.meal:first-of-type{border-top:0}
.meal-row{display:grid;grid-template-columns:78px minmax(0,1fr) auto;gap:10px;align-items:center}
.tag{font-size:.7rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.mname{font-weight:600;min-width:0}
.mmeta{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.mtags{font-size:.78rem;color:var(--leaf);font-weight:500;margin-top:1px}
.bal{display:grid;gap:0}
.bal-row{display:grid;grid-template-columns:minmax(0,1fr) auto 22px;gap:10px;align-items:baseline;padding:7px 0;border-top:1px dotted var(--line);font-size:.92rem}
.bal-row:first-child{border-top:0}
.bal-row .o{color:var(--muted);font-size:.8rem}
.bal-row .n{font-family:var(--f-mono);text-align:right;white-space:nowrap}
.bal-row .ok{color:var(--leaf);font-weight:700;text-align:center}
.bal-row .no{color:var(--tomato);font-weight:700;text-align:center}
summary.h{font-family:var(--f-display);font-weight:800;font-size:1.15rem}
.swap{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:transparent;font-size:1.05rem}
details summary{cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}
.ing{margin:8px 0 2px;padding:0;list-style:none;display:grid;gap:3px;font-size:.9rem;color:var(--muted)}
.ing li{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dotted var(--line);padding-bottom:2px}
.ing li span:last-child{font-family:var(--f-mono);white-space:nowrap}
.rq{display:grid;gap:10px;margin-bottom:12px}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:10px}
.rcard>summary{display:grid;grid-template-columns:78px minmax(0,1fr);gap:10px;align-items:center}
.rcard .mname{display:block}
.rbody{display:grid;gap:12px;margin-top:12px}
.rbody h4{margin:0;font-family:var(--f-display);font-size:.78rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--leaf)}
.steps{margin:0;padding:0;list-style:none;display:grid;gap:10px;counter-reset:st}
.steps li{counter-increment:st;display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start}
.steps li::before{content:counter(st);width:28px;height:28px;border-radius:50%;background:var(--leaf);color:var(--leaf-ink);font-weight:700;font-size:.85rem;display:flex;align-items:center;justify-content:center}
.steps b{font-family:var(--f-mono);font-weight:500;font-size:.9em;background:var(--soft);border-radius:6px;padding:0 4px;white-space:nowrap}
.rnote{font-size:.85rem;color:var(--muted);margin:0}
.rlink{display:inline-flex;align-items:center;height:38px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font-weight:500;color:var(--ink);text-decoration:none}
.rrow{display:flex;flex-wrap:wrap;gap:8px}
.ghost.sm{height:34px;font-size:.9rem}
.hr{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btnl{display:flex;align-items:center;justify-content:center;height:48px;border-radius:10px;background:var(--leaf);color:var(--leaf-ink);font-weight:600;cursor:pointer;padding:0 18px}
.line{transition:opacity .35s,transform .35s}
.line.done{opacity:0;transform:translateX(28px)}
.empty{text-align:center;padding:26px 16px;display:grid;gap:12px;justify-items:center}
.empty b{font-family:var(--f-display);font-size:1.25rem}
dialog{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:0;width:calc(100% - 32px);max-width:520px}
dialog::backdrop{background:rgba(0,0,0,.5)}
.dlg-in{padding:18px;display:grid;gap:14px}
.skins{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.skin{display:grid;gap:6px;text-align:left;padding:10px;border:2px solid var(--line);border-radius:12px;background:transparent}
.skin[aria-pressed="true"]{border-color:var(--leaf)}
.skin .sw{display:flex;height:30px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.skin .sw i{flex:1}
.skin b{font-size:.95rem}
.skin span.d{font-size:.78rem;color:var(--muted)}
.edrow{display:grid;grid-template-columns:76px 74px minmax(0,1fr) auto;gap:6px;align-items:center;padding:8px 0;border-top:1px dotted var(--line)}
.edrow .edtxt{grid-column:1/-1}
.edrow .ednew{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) 92px 84px;gap:6px}
.edrow input,.edrow select,.edf input,.edf select{height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0 8px;min-width:0;width:100%}
.edf{display:grid;gap:12px}
.edf2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.edf label.lbl{display:block;margin-bottom:4px}
.edf textarea{min-height:120px;font-family:var(--f-body);font-size:.95rem}
.bal-row2{display:grid;grid-template-columns:minmax(0,1fr) auto auto 22px;gap:8px;align-items:center;padding:7px 0;border-top:1px dotted var(--line);font-size:.92rem}
.bal-row2:first-of-type{border-top:0}
.bal-row2 .o{color:var(--muted);font-size:.78rem;display:block}
.bal-row2 .n{font-family:var(--f-mono);text-align:right;white-space:nowrap;color:var(--muted);font-size:.85rem}
.gs{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.gs button{width:30px;height:30px;border:0;background:transparent;font-size:1.05rem}
.gs button:active{background:var(--soft)}
.gs output{min-width:24px;text-align:center;font-family:var(--f-mono);font-weight:500}
.gs.auto output{color:var(--muted);font-weight:400}
.bal-row2 .ok{color:var(--leaf);font-weight:700;text-align:center}
.bal-row2 .no{color:var(--tomato);font-weight:700;text-align:center}
.favb[aria-pressed="true"]{border-color:var(--tomato);color:var(--tomato)}
.scanimg{max-width:100%;max-height:220px;border-radius:10px;border:1px solid var(--line);justify-self:start}
.pchips{display:flex;flex-wrap:wrap;gap:8px}
.refl{display:grid;gap:4px;font-size:.88rem;color:var(--muted)}
.refl div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dotted var(--line);padding-bottom:3px}
.ticket{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 0 0}
.sec{padding:14px 16px 4px;font-size:.74rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--leaf)}
.line{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;padding:10px 16px;border-top:1px dotted var(--line);align-items:start}
.line input[type=checkbox]{width:22px;height:22px;margin:2px 0 0;accent-color:var(--leaf)}
.line.done .lname{text-decoration:line-through;color:var(--muted)}
.lname{font-weight:600}
.lsub{font-size:.85rem;color:var(--muted)}
.lcost{font-family:var(--f-mono);font-weight:500;text-align:right}
.pin{display:inline-flex;align-items:center;gap:4px;margin-top:2px}
.pin input{width:74px;height:30px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0 6px;font-family:var(--f-mono);font-size:.85rem;text-align:right}
.total{display:flex;justify-content:space-between;align-items:baseline;padding:14px 16px;border-top:2px solid var(--ink);margin-top:8px;font-family:var(--f-display);font-weight:800;font-size:1.2rem}
.total span:last-child{font-family:var(--f-mono);font-weight:500}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px}
.card h2{font-size:1.15rem;font-weight:800}
.card p{margin:0;color:var(--muted);font-size:.92rem}
.cmp{display:grid;gap:10px}
.cmp-row{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:.92rem}
.cmp-row .bar{height:12px}
.cmp-row.best .bar>i{background:var(--leaf)}
.cmp-row:not(.best) .bar>i{background:var(--muted)}
.cmp-row .v{font-family:var(--f-mono);text-align:right;white-space:nowrap}
.cmp-row.sel .nm{font-weight:700}
.nm{min-width:0}
textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px;font-family:var(--f-mono);font-size:.85rem;resize:vertical}
.row{display:flex;flex-wrap:wrap;gap:8px}
.foot{font-size:.82rem;color:var(--muted);margin:0}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20;max-width:calc(100% - 32px)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
@media (max-width:420px){
  .meal-row{grid-template-columns:minmax(0,1fr) auto}
  .meal-row .tag{grid-column:1/-1}
  .cmp-row{grid-template-columns:84px minmax(0,1fr) auto}
}
</style>
<script src="config.js"></script>
<script>
if("serviceWorker" in navigator && !window.Capacitor){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}
</script>
</head>
<body>



<div class="app">
  <header class="brand">
    <div>
      <h1>La Cesta</h1>
      <p>Elige supermercado, personas y presupuesto. Te armo el menú de la semana y la lista de la compra con sus precios.</p>
    </div>
    <div class="hr"><button class="ghost" data-act="scango">Escanear</button><button class="ghost" data-act="theme">Apariencia</button><span class="status" id="status">Solo en este dispositivo</span></div>
  </header>

  <section class="panel" aria-label="Ajustes">
    <div class="field">
      <label class="lbl" for="sm">Supermercado</label>
      <select id="sm"></select>
    </div>
    <div class="field">
      <label class="lbl" for="cp">Código postal</label>
      <input id="cp" type="text" inputmode="numeric" maxlength="5" autocomplete="postal-code">
    </div>
    <div class="field">
      <span class="lbl" id="lp">Adultos</span>
      <div class="stepper" role="group" aria-labelledby="lp">
        <button id="pm" aria-label="Menos adultos">−</button>
        <output id="pp" aria-live="polite"></output>
        <button id="pl" aria-label="Más adultos">+</button>
      </div>
    </div>
    <div class="field">
      <span class="lbl" id="lk">Niños de 3 a 12</span>
      <div class="stepper" role="group" aria-labelledby="lk">
        <button id="km" aria-label="Menos niños">−</button>
        <output id="kp" aria-live="polite"></output>
        <button id="kl" aria-label="Más niños">+</button>
      </div>
    </div>
    <div class="field">
      <span class="lbl" id="lt">Menores de 3 años</span>
      <div class="stepper" role="group" aria-labelledby="lt">
        <button id="tm" aria-label="Menos menores de 3 años">−</button>
        <output id="tp" aria-live="polite"></output>
        <button id="tl" aria-label="Más menores de 3 años">+</button>
      </div>
    </div>
    <div class="field">
      <label class="lbl" for="budget">Presupuesto semanal</label>
      <div class="budget-wrap"><input id="budget" type="number" min="10" step="5" inputmode="decimal"><span>€</span></div>
    </div>
    <div class="field wide">
      <span class="lbl">Qué comidas incluir</span>
      <div class="chips">
        <button class="chip" id="mb" aria-pressed="false">Desayuno</button>
        <button class="chip" id="mc" aria-pressed="true">Comida</button>
        <button class="chip" id="md" aria-pressed="true">Cena</button>
      </div>
    </div>
    <div class="field wide">
      <span class="lbl">Tipo de comidas</span>
      <div class="chips" id="styles"></div>
      <p class="rnote" id="stynote" style="margin:6px 0 0"></p>
    </div>
    <div class="field wide"><button class="primary" id="gen">Crear otro menú</button></div>
  </section>

  <section class="meter" id="meter" aria-live="polite"></section>

  <nav class="tabs" role="tablist" aria-label="Vistas">
    <button role="tab" data-tab="menu">Menú</button>

var STEPS={"Tostadas con tomate y aceite": ["Tuesta {pan} en rebanadas.", "Ralla {tomate} y escurre un poco el agua sobrante.", "Reparte el tomate sobre las tostadas y aliña con {aceite} y una pizca de sal."], "Avena con leche y plátano": ["Calienta {leche} sin dejar que hierva.", "Añade {avena} y cocina 4-5 minutos a fuego bajo, removiendo, hasta que espese.", "Sirve con {platano} en rodajas por encima."], "Yogur con manzana y avena": ["Lava {manzana} y córtala en dados pequeños.", "Pon {yogur} en un bol y mezcla la manzana.", "Espolvorea {avena} por encima. Si la tuestas 2 minutos en una sartén seca queda más crujiente."], "Tostada con jamón y huevo": ["Tuesta {pan}.", "Cocina {huevos} en una sartén con {aceite} hasta que la clara y la yema cuajen del todo.", "Monta la tostada con {jamon} y el huevo encima."], "Pan con tomate y jamón serrano": ["Tuesta {pan} en rebanadas.", "Ralla {tomate} y extiéndelo sobre el pan con {aceite}.", "Cubre con {serrano}."], "Tostada de manchego y tomate": ["Tuesta {pan}.", "Ralla {tomate} y repártelo sobre las tostadas con {aceite}.", "Añade láminas finas de {manchego}."], "Pan con aceite y naranja": ["Tuesta {pan} y riégalo con {aceite}.", "Pela {naranja} y sírvela en gajos al lado, o exprímela para tomarla en zumo."], "Leche con tostada de aceite": ["Calienta {leche}.", "Tuesta {pan} y riégalo con {aceite}.", "Sirve la leche caliente con la tostada."], "Lentejas estofadas con verduras": ["Pica {cebolla}, {pimiento} y {ajo}. Pela y corta {zanahoria} y {patata} en trozos de 2 cm.", "Sofríe cebolla, pimiento y ajo con {aceite} a fuego medio 5 minutos.", "Añade zanahoria, patata y {lentejas} bien lavadas. Cubre con agua fría y una pizca de sal.", "Cuece a fuego suave 30-40 minutos hasta que las lentejas estén tiernas; añade agua caliente si hace falta.", "Deja reposar 5 minutos antes de servir."], "Arroz con pollo y verduras": ["Trocea {muslo} y sazona. Pica {cebolla} y {pimiento}.", "Dora el pollo con {aceite} en una paella o cazuela ancha y resérvalo.", "En la misma grasa sofríe cebolla y pimiento 5 minutos; añade {ttritu} y cocina 3 minutos más.", "Incorpora {arroz}, remueve 1 minuto, vuelve a poner el pollo y añade {guisantes}. Cubre con el doble de agua o caldo caliente que de arroz, en volumen.", "Cuece 18-20 minutos a fuego medio-bajo sin remover. Comprueba que el pollo está hecho por dentro y deja reposar 5 minutos tapado."], "Macarrones con carne y tomate": ["Pica {cebolla} y sofríela con {aceite} 5 minutos.", "Añade {picada}, desmenúzala y cocínala hasta que pierda el color rosado.", "Agrega {ttritu} y sal, y cuece 15 minutos a fuego bajo.", "Cuece {pasta} en agua con sal el tiempo del paquete y escúrrela.", "Mezcla la pasta con la salsa y sirve con {queso} por encima."], "Garbanzos con espinacas": ["Escurre y enjuaga {garbanzos}.", "Dora {ajo} laminado en {aceite} sin que se queme y añade {tfrito}.", "Incorpora {espinacas} y cocina 2-3 minutos hasta que se reduzcan.", "Añade los garbanzos con un chorrito de agua y sal, y cuece 8-10 minutos."], "Merluza al horno con patatas": ["Precalienta el horno a 200 °C. Pela {patata} y córtala en rodajas finas.", "Pon las patatas en una fuente con {aceite}, sal y {ajo} picado, y hornea 20 minutos.", "Coloca encima {merluza} sazonada y exprime {limon}.", "Hornea 10-12 minutos más, hasta que el pescado esté opaco y se separe en lascas."], "Pollo al limón con arroz y brócoli": ["Corta {pechuga} en filetes finos, sazona y deja 10 minutos con el zumo de {limon}.", "Cuece {arroz} en agua con sal 15-18 minutos y escurre.", "Cuece {brocoli} en ramilletes 4-5 minutos en agua con sal y escurre.", "Dora el pollo en una sartén con {aceite} 3-4 minutos por lado, hasta que no quede rosado por dentro.", "Sirve el pollo sobre el arroz con el brócoli."], "Pasta con atún y tomate": ["Sofríe {cebolla} picada con {aceite} 5 minutos.", "Añade {ttritu} y cuece 10 minutos a fuego bajo.", "Cuece {pasta} según el paquete y escúrrela.", "Escurre {atun}, añádelo a la salsa, caliéntalo 1 minuto y mezcla con la pasta."], "Cuscús con pollo y verduras": ["Corta {pechuga} en dados, y {calabacin} y {zanahoria} en trozos pequeños.", "Saltea el pollo con {aceite} 5 minutos; añade las verduras y cocina 6-8 minutos más, hasta que el pollo esté hecho por dentro.", "Hidrata {cuscus} con el mismo volumen de agua hirviendo y sal, tapa 5 minutos y suelta los granos con un tenedor.", "Mezcla el cuscús con el salteado y sirve."], "Cuscús con garbanzos y verduras": ["Corta {calabacin} y {zanahoria} en trozos pequeños y saltéalos con {aceite} 8 minutos.", "Añade {garbanzos} escurridos y cocina 3 minutos.", "Hidrata {cuscus} con el mismo volumen de agua hirviendo y sal, tapa 5 minutos y suelta los granos con un tenedor.", "Mezcla todo y sirve."], "Crema de calabacín con huevo duro": ["Cuece {huevos} 10 minutos desde que hierva el agua, enfría y pela.", "Pica {cebolla} y sofríela con {aceite}; añade {calabacin} y {patata} en trozos.", "Cubre con agua justa, sala y cuece 15-20 minutos.", "Tritura con {nata}, rectifica de sal y sirve con el huevo duro picado por encima."], "Albóndigas en salsa con arroz": ["Mezcla {picada} con {huevos} batido y sal; forma bolitas y pásalas por {harina}.", "Dóralas en una sartén con {aceite} y resérvalas.", "En la misma sartén sofríe {cebolla} picada, añade {tfrito} y un vaso de agua, y deja 5 minutos.", "Vuelve a poner las albóndigas y cuece 15 minutos tapadas.", "Cuece {arroz} aparte 15-18 minutos y sirve todo junto."], "Lomo con pimientos y patatas": ["Corta {patata} en rodajas y {pimiento} en tiras.", "Cocina patata y pimiento en una sartén con {aceite} a fuego medio 15 minutos, hasta que estén tiernos.", "Sazona {lomo} en filetes y dóralo con {ajo} 3 minutos por lado, hasta que no quede rosado.", "Sirve el lomo con las patatas y los pimientos."], "Salmón al horno con verduras": ["Precalienta el horno a 200 °C.", "Corta {calabacin} y {pimiento} en trozos, ponlos en una bandeja con {aceite} y sal, y hornea 10 minutos.", "Añade {salmon} sazonado y unas gotas de {limon}.", "Hornea 10-12 minutos más, hasta que el salmón se separe en lascas."], "Alubias con verduras": ["Pica {cebolla}, {pimiento} y {zanahoria}.", "Sofríelas con {aceite} 8 minutos y añade {tfrito}.", "Incorpora {alubias} escurridas y enjuagadas con un vaso de agua, y cuece 10-12 minutos."], "Arroz con gambas al ajillo": ["Descongela {gambas} en la nevera y sécalas bien.", "Cuece {arroz} 15-18 minutos en agua con sal y escurre.", "Dora {ajo} laminado en {aceite} sin quemarlo y cocina las gambas 2-3 minutos por lado.", "Mezcla con el arroz y sirve enseguida."], "Berenjenas rellenas gratinadas": ["Precalienta el horno a 200 °C. Corta {berenjena} por la mitad y vacíala con una cuchara, dejando 1 cm de pared.", "Hornea las mitades 20 minutos.", "Pica la pulpa y sofríela con {picada} hasta que la carne esté hecha; añade {tfrito}.", "Rellena las berenjenas, cubre con {queso} y gratina 8-10 minutos."], "Arroz con verduras y huevo": ["Cuece {arroz} 15-18 minutos en agua con sal y escurre.", "Saltea {pimiento} y {zanahoria} en dados con {aceite} 8 minutos y añade {guisantes}.", "Haz {huevos} a la plancha, con la yema cuajada.", "Mezcla el arroz con las verduras y sirve con el huevo encima."], "Macarrones gratinados con tomate": ["Sofríe {cebolla} con {aceite}, añade {ttritu} y cuece 10 minutos.", "Cuece {pasta} según el paquete y escúrrela.", "Mezcla con la salsa, pasa a una fuente, cubre con {queso} y gratina 5-8 minutos a 200 °C."], "Paella de pollo y judías verdes": ["Trocea {muslo} y sazona. Limpia y corta {judias}; ralla {tomate}.", "Dora el pollo en {aceite} en la paella y retíralo.", "Sofríe las judías 3 minutos y añade el tomate rallado hasta que se reduzca.", "Agrega {arroz}, remueve, devuelve el pollo y vierte {caldo} caliente. Sala y cuece a fuego medio 18 minutos sin remover.", "Comprueba que el pollo está hecho por dentro y deja reposar 5 minutos."], "Fideuà de mejillones y calamar": ["Abre {mejillones} al vapor con un chorrito de agua en una olla tapada 3-4 minutos; descarta los que no abran y reserva el caldo.", "Sofríe {ajo} y {calamares} con {aceite} 3 minutos y añade {ttritu}.", "Incorpora {fideos} y rehógalos 1 minuto; vierte {caldo} caliente junto con el caldo de los mejillones.", "Cuece 8-10 minutos, añade los mejillones y deja reposar 3 minutos."], "Arroz caldoso de verduras": ["Corta {calabacin}, {pimiento} y {judias}, y ralla {tomate}.", "Sofríe las verduras con {aceite} 8 minutos y añade el tomate.", "Agrega {arroz} y {caldo} caliente. Cuece 18 minutos hasta que quede meloso y rectifica de sal."], "Cocido madrileño ligero": ["Pon {ternera} en una olla cubierta de agua con sal y cuece 1 hora a fuego suave, quitando la espuma.", "Añade {zanahoria}, {patata} y {chorizo} y cuece 20 minutos.", "Incorpora {garbanzos} escurridos y {caldo}, y cuece 10 minutos más.", "Sirve el caldo y el cocido por separado, si te gusta."], "Fabada rápida": ["Pica {cebolla} y corta {chorizo} y {panceta} en trozos.", "Rehoga chorizo y panceta en una olla sin aceite 5 minutos y añade la cebolla.", "Incorpora {alubias} escurridas y {caldo}, y cuece 25-30 minutos a fuego suave.", "Deja reposar 5 minutos antes de servir."], "Lentejas con chorizo": ["Pica {cebolla}, {pimiento} y pela {zanahoria} y {patata} en trozos.", "Sofríe cebolla y pimiento con {aceite} 5 minutos.", "Añade zanahoria, patata, {chorizo} en rodajas y {lentejas} lavadas. Cubre con agua fría y sal.", "Cuece a fuego suave 30-40 minutos hasta que las lentejas estén tiernas."], "Potaje de vigilia con bacalao": ["Cuece {huevos} 10 minutos, enfría, pela y pica.", "Dora {ajo} en {aceite}, añade {garbanzos} y agua suficiente para cubrirlos.", "Cuece 10 minutos; añade {bacalao} desmigado y {espinacas}, y cocina 8 minutos más.", "Sirve con el huevo picado por encima."], "Pisto manchego con huevo": ["Corta {cebolla}, {pimiento} y {calabacin} en dados; pela y trocea {tomate}.", "Pocha cebolla y pimiento con {aceite} a fuego bajo 10 minutos y añade el calabacín 5 minutos más.", "Incorpora el tomate, sal y cuece 20 minutos, hasta que espese.", "Fríe {huevos} con la yema cuajada y sirve sobre el pisto con {pan}."], "Menestra de verduras con jamón": ["Limpia y corta {judias} y pela {zanahoria}; pica {cebolla}.", "Cuece judías, zanahoria y {guisantes} 8 minutos en agua con sal y escurre guardando un vaso del caldo.", "Sofríe la cebolla con {aceite}, añade {serrano} en tiras y {harina}, y tuesta 1 minuto.", "Agrega las verduras y {caldo} con un poco del agua de cocción; cuece 5 minutos hasta ligar la salsa."], "Judías verdes con patata y jamón": ["Limpia y corta {judias}; pela {patata} en dados.", "Cuece judías y patata juntas 12-15 minutos en agua con sal y escurre.", "Sofríe {cebolla} y {ajo} con {aceite}, añade {serrano} en tiras 1 minuto y mezcla con las verduras."], "Coliflor gratinada con bechamel": ["Cuece {coliflor} en ramilletes 8 minutos y escurre bien.", "Bechamel: calienta {aceite} en un cazo, añade {harina} y tuéstala 1 minuto; vierte {leche} poco a poco, removiendo, hasta que espese. Sala.", "Coloca la coliflor en una fuente, cubre con la bechamel y {queso}.", "Gratina 8-10 minutos a 200 °C."], "Pollo al ajillo con patatas": ["Sazona {muslo} troceado. Pela {patata} y córtala en gajos finos.", "Dora el pollo en {aceite} 8 minutos por todos los lados.", "Añade las patatas y {ajo} machacado; cocina a fuego medio 20-25 minutos, dando la vuelta de vez en cuando.", "Comprueba que el pollo está hecho por dentro y termina con unas gotas de {limon}."], "Pollo al horno con verduras": ["Precalienta el horno a 200 °C. Corta {patata}, {pimiento} y {cebolla} en trozos.", "Pon las verduras en una bandeja con {aceite} y sal, y coloca encima {muslo} sazonado.", "Hornea 45-50 minutos, dando la vuelta al pollo a mitad de cocción.", "Comprueba que el pollo está hecho por dentro y sirve."], "Pechugas rellenas de jamón y queso": ["Abre {pechuga} en filetes finos y sazona.", "Pon {serrano} y {queso} en el centro y enrolla; sujeta con palillos.", "Pasa por {harina}, {huevos} batido y {panrallado}.", "Dora con {aceite} en la sartén 4-5 minutos por lado a fuego medio, hasta que estén hechas por dentro.", "Sirve con ensalada de {lechuga}."], "Estofado de ternera con patatas": ["Sazona {ternera} y pásala por {harina}. Dórala en {aceite} y resérvala.", "Pica {cebolla} y {zanahoria} y sofríelas en la misma olla 8 minutos.", "Vuelve a poner la carne, añade {caldo} y agua hasta cubrir; cuece tapado 1 hora a fuego suave.", "Añade {patata} en trozos y cuece 25 minutos más, hasta que la carne esté tierna."], "Pimientos rellenos de carne y arroz": ["Precalienta el horno a 190 °C. Cuece {arroz} 10 minutos y escurre. Corta la tapa de {pimiento} y límpialo.", "Sofríe {cebolla} picada con {aceite}, añade {picada} y cocínala hasta que esté hecha.", "Mezcla con el arroz y {ttritu}; rellena los pimientos.", "Hornea 35-40 minutos, hasta que estén tiernos."], "Lasaña de carne y verduras": ["Sofríe {cebolla} y {zanahoria} picadas con {aceite}; añade {picada} y cocina hasta que esté hecha. Agrega {ttritu} y cuece 15 minutos.", "Bechamel: tuesta {harina} en un cazo con un poco de aceite 1 minuto y añade {leche} poco a poco removiendo; sala.", "Cuece {pasta} (placas) según el paquete.", "Monta capas de pasta, carne y bechamel en una fuente, y cubre con {queso}.", "Hornea 25-30 minutos a 190 °C."], "Espaguetis a la puttanesca": ["Sofríe {ajo} laminado con {aceite} sin quemarlo.", "Añade {anchoas} desmenuzadas y {aceitunas} troceadas; cocina 2 minutos.", "Agrega {ttritu} y cuece 12 minutos a fuego medio.", "Cuece {pasta} según el paquete, escurre y mezcla con la salsa."], "Pasta con berenjena y mozzarella": ["Corta {berenjena} en dados y saltéala con {aceite} 8 minutos hasta que se dore.", "Añade {cebolla} picada y {ttritu}; cuece 10 minutos.", "Cuece {pasta} según el paquete y escúrrela.", "Mezcla con la salsa y añade {mozzarella} en trozos; remueve hasta que se funda."], "Ratatouille con huevo": ["Corta {berenjena}, {calabacin}, {pimiento}, {tomate} y {cebolla} en dados.", "Sofríe cebolla y pimiento con {aceite} 8 minutos; añade berenjena y calabacín y cocina 10 minutos.", "Incorpora el tomate y sal; cuece tapado 15 minutos.", "Fríe {huevos} con la yema cuajada y sirve sobre las verduras."], "Musaka de berenjena y carne": ["Precalienta el horno a 200 °C. Corta {berenjena} y {patata} en rodajas y hornéalas con {aceite} 20 minutos.", "Sofríe {cebolla} picada, añade {picada} y cocina hasta que esté hecha; agrega {ttritu}.", "Bechamel: tuesta {harina} en un cazo con un poco de aceite 1 minuto, añade {leche} poco a poco removiendo y sala.", "Monta capas de patata, berenjena y carne en una fuente; cubre con bechamel y {queso}.", "Hornea 30 minutos a 190 °C."], "Merluza en salsa verde con guisantes": ["Pela {patata} y córtala en rodajas; cuécela 10 minutos en agua con sal y resérvala.", "Sofríe {ajo} en {aceite}, añade {harina} y tuéstala 1 minuto.", "Vierte {caldo} con un poco de agua removiendo hasta formar una salsa ligera y añade {guisantes}.", "Pon {merluza} sazonada y la patata; cuece 6-8 minutos moviendo la cazuela con suavidad."], "Bacalao con tomate y pimientos": ["Pela {patata} y córtala en rodajas finas; pica {cebolla} y {pimiento}.", "Sofríe cebolla y pimiento con {aceite} 8 minutos, añade {ttritu} y cuece 10 minutos.", "Agrega la patata y un poco de agua; cuece 10 minutos.", "Coloca {bacalao} desalado encima y cuece 8 minutos tapado."], "Dorada al horno con patatas": ["Precalienta el horno a 200 °C. Corta {patata} y {pimiento} en rodajas finas y ponlos en una bandeja con {aceite} y sal; hornea 15 minutos.", "Sazona {dorada} limpia y colócala encima con rodajas de {limon}.", "Hornea 20-25 minutos, hasta que la carne se separe de la espina."], "Lubina al horno con verduras": ["Precalienta el horno a 200 °C. Corta {patata}, {calabacin} y {cebolla} en rodajas y ponlas en una bandeja con {aceite} y sal; hornea 15 minutos.", "Sazona {lubina} limpia y colócala encima con rodajas de {limon}.", "Hornea 20-25 minutos, hasta que la carne se separe de la espina."], "Sardinas a la plancha con ensalada": ["Limpia {sardinas} y sécalas; sazona con sal gruesa.", "Hazlas en una plancha caliente con unas gotas de {aceite}, 2-3 minutos por lado.", "Prepara una ensalada con {tomate} y {cebolla} en tiras, aliñada con {aceite} y sal.", "Sirve con {limon} y {pan}."], "Mejillones a la marinera": ["Limpia {mejillones} y descarta los que estén abiertos o rotos.", "Sofríe {cebolla} y {ajo} con {aceite} 5 minutos y añade {ttritu}; cuece 8 minutos.", "Añade los mejillones, tapa y cocina 4-5 minutos hasta que se abran; descarta los que no abran.", "Sirve con {pan} para mojar la salsa."], "Calamares a la romana con ensalada": ["Seca bien {calamares}, sazona y pásalos por {harina} y {huevos} batido.", "Fríelos en abundante {aceite} bien caliente, 2-3 minutos, y escúrrelos en papel de cocina.", "Prepara una ensalada con {lechuga} y {tomate}.", "Sirve con {limon}."], "Pulpo a la gallega con patatas": ["Pela {patata}, córtala en rodajas gruesas y cuécela 15 minutos en agua con sal; escurre.", "Calienta {pulpo} cocido según el envase o 2 minutos en agua caliente y córtalo en rodajas.", "Coloca las patatas, el pulpo encima, y aliña con {aceite}, sal gruesa y pimentón."], "Boquerones fritos con ensalada": ["Limpia {boquerones}, sécalos y pásalos por {harina} con sal.", "Fríelos en {aceite} bien caliente 1-2 minutos y escúrrelos en papel de cocina.", "Prepara una ensalada con {lechuga} y {tomate}.", "Sirve con {limon}."], "Atún encebollado con arroz": ["Corta {cebolla} en juliana y pochala con {aceite} a fuego bajo 15 minutos.", "Añade {ttritu} y cuece 5 minutos.", "Cuece {arroz} 15-18 minutos y escurre.", "Incorpora {atun} escurrido a la cebolla, calienta 2 minutos y sirve con el arroz."], "Ensalada de garbanzos y atún": ["Escurre y enjuaga {garbanzos}.", "Corta {tomate}, {pepino} y {cebolla} en dados pequeños.", "Mezcla todo con {atun} escurrido y {aceitunas}.", "Aliña con {aceite} y sal."], "Ensalada griega con cuscús y feta": ["Hidrata {cuscus} con el mismo volumen de agua hirviendo y sal, tapa 5 minutos y suelta los granos con un tenedor.", "Corta {pepino}, {tomate} y {cebolla} en dados.", "Mezcla con el cuscús, {feta} desmenuzado y {aceitunas}.", "Aliña con {aceite} y sal."], "Migas con chorizo y huevo": ["Corta {pan} del día anterior en trozos pequeños, humedécelo con un poco de agua con sal y déjalo 30 minutos tapado.", "Sofríe {chorizo} y {panceta} en dados con {ajo} y {aceite} 5 minutos.", "Añade el pan y remueve a fuego medio 15 minutos, hasta que quede suelto y dorado.", "Fríe {huevos} con la yema cuajada y sirve encima."], "Cazuela de garbanzos y calabaza": ["Pela {calabaza} y córtala en dados; pica {cebolla}.", "Sofríe la cebolla con {aceite}, añade la calabaza y {tfrito}; cocina 8 minutos.", "Incorpora {garbanzos} escurridos y un vaso de agua; cuece 10 minutos.", "Añade {espinacas} los últimos 2 minutos."], "Espaguetis carbonara": ["Cuece {pasta} según el paquete; reserva un vaso del agua de cocción y escurre.", "Dora {panceta} en dados con {aceite} hasta que quede crujiente.", "Bate {huevos} con {queso} y pimienta.", "Con el fuego apagado, mezcla la pasta con la panceta y la mezcla de huevo, añadiendo agua de cocción hasta lograr una salsa cremosa; el calor de la pasta cuaja el huevo."], "Espaguetis con gambas al ajillo": ["Descongela {gambas} y sécalas.", "Cuece {pasta} según el paquete y escúrrela.", "Dora {ajo} laminado en {aceite} sin quemarlo y cocina las gambas 2 minutos por lado.", "Mezcla con la pasta, remueve 1 minuto y sirve."], "Lomo en salsa de cebolla con arroz": ["Corta {cebolla} en juliana y pochala con {aceite} 15 minutos.", "Sazona {lomo} en filetes, pásalo por {harina} y dóralo en otra sartén 2 minutos por lado.", "Pasa el lomo a la cebolla, añade {caldo} y cuece tapado 12 minutos, hasta que no quede rosado.", "Cuece {arroz} 15-18 minutos y sirve juntos."], "Tortilla de patatas con ensalada": ["Pela {patata} y córtala en láminas finas; pica {cebolla}.", "Pocha patata y cebolla en una sartén con {aceite} a fuego medio-bajo 15-20 minutos, hasta que estén tiernas, sin que se doren.", "Bate {huevos} con sal, añade las patatas escurridas y mezcla.", "Cuaja la tortilla en una sartén 3-4 minutos por lado; para toda la familia conviene que quede bien cuajada por dentro.", "Sirve con ensalada de {lechuga} y {tomate}."], "Revuelto de champiñones y jamón": ["Limpia {champis} con un paño húmedo y lamínalos.", "Saltéalos con {aceite} a fuego fuerte 5 minutos, hasta que pierdan el agua.", "Añade {jamon} en tiras y 1 minuto después {huevos} batidos con sal.", "Remueve a fuego bajo hasta que cuaje del todo y sirve con {pan}."], "Ensalada completa de atún": ["Cuece {huevos} 10 minutos desde que hierva el agua, enfría y pela.", "Lava y trocea {lechuga}; corta {tomate} y {cebolla}.", "Monta la ensalada con {atun} escurrido y el huevo en cuartos.", "Aliña con {aceite} y sal, y sirve con {pan}."], "Crema de verduras con tostadas": ["Pela y trocea {calabacin}, {zanahoria}, {patata} y {cebolla}.", "Sofríe la cebolla con {aceite} 3 minutos, añade el resto y cubre con agua justa y sal.", "Cuece 20 minutos y tritura hasta que quede fina.", "Tuesta {pan}, ponle {queso} y gratina 2 minutos. Sirve la crema con las tostadas."], "Tortilla francesa con ensalada": ["Bate {huevos} con una pizca de sal.", "Cuaja en una sartén con {aceite} a fuego medio, doblando por la mitad cuando esté hecha por dentro.", "Sirve con ensalada de {lechuga} y {tomate}, y con {pan}."], "Merluza a la plancha con judías verdes": ["Limpia y corta {judias}; cuécelas 10-12 minutos en agua con sal y escúrrelas.", "Dora {ajo} laminado en {aceite} sin quemarlo y saltea las judías 2 minutos.", "Sazona {merluza} y hazla en una plancha caliente 3-4 minutos por lado, hasta que esté opaca.", "Sirve con unas gotas de {limon}."], "Pechuga a la plancha con ensalada": ["Aplana {pechuga} en filetes finos y sazona.", "Hazla en una plancha caliente con unas gotas de {aceite} 3-4 minutos por lado, hasta que no quede rosada por dentro.", "Prepara una ensalada con {lechuga} y {tomate}, aliñada con {limon} y sal.", "Sirve junto."], "Salteado de verduras con huevo": ["Corta {brocoli} en ramilletes, {zanahoria} en bastones finos y {cebolla} en tiras.", "Cuece el brócoli y la zanahoria 4 minutos en agua con sal y escurre.", "Saltea la cebolla con {aceite}, añade las verduras y cocina 4 minutos.", "Haz {huevos} a la plancha con la yema cuajada y sirve encima."], "Huevos al plato con tomate": ["Precalienta el horno a 200 °C.", "Calienta {tfrito} en una cazuela individual o fuente.", "Casca {huevos} encima, sala y cubre con {queso}.", "Hornea 8-10 minutos, hasta que la clara y la yema estén cuajadas. Sirve con {pan}."], "Pasta cremosa con champiñones": ["Lamina {champis} y pica {cebolla}.", "Sofríe la cebolla con {aceite} 3 minutos, añade los champiñones y saltea 6 minutos.", "Agrega {nata}, sal y cuece 3 minutos.", "Cuece {pasta} según el paquete, escurre y mezcla con la salsa y {queso}."], "Hamburguesa casera con ensalada": ["Mezcla {picada} con sal y forma hamburguesas de 2 cm de grosor.", "Hazlas en una sartén con {aceite} 4-5 minutos por lado, hasta que no quede rosa por dentro.", "Abre {pan} y monta con {lechuga}, {tomate} y {cebolla}."], "Wraps de verduras y huevo": ["Corta {pimiento} en tiras y saltéalo con un poco de aceite 6 minutos.", "Haz {huevos} en tortilla francesa y córtala en tiras.", "Calienta {wraps} en una sartén seca 20 segundos por lado.", "Rellena con el pimiento, el huevo, {lechuga} y {yogur} como salsa; enrolla."], "Salmón a la plancha con espinacas": ["Sazona {salmon} y hazlo en una plancha caliente con unas gotas de {aceite}, 3-4 minutos por lado.", "Dora {ajo} laminado en una sartén con aceite, añade {espinacas} y saltea 2-3 minutos.", "Sirve el salmón sobre las espinacas con un poco de {limon}."], "Wraps de pollo y ensalada": ["Corta {pechuga} en tiras, sazona y hazla en una sartén con unas gotas de aceite 5 minutos, hasta que no quede rosada por dentro.", "Calienta {wraps} 20 segundos por lado en una sartén seca.", "Rellena con el pollo, {lechuga}, {tomate} y {yogur} como salsa, y enrolla."], "Crema de calabaza con picatostes": ["Pela y trocea {calabaza}, {patata} y {cebolla}.", "Sofríe la cebolla con {aceite}, añade el resto, cubre con agua y sal, y cuece 20 minutos.", "Tritura con {nata}.", "Corta {pan} en cubos, tuéstalos al horno o en una sartén y sirve como picatostes."], "Gazpacho andaluz con taquitos de jamón": ["Tritura {tomate}, {pepino}, {pimiento}, {ajo} y {pan} remojado con {aceite}, sal y un poco de agua fría.", "Cuela si quieres una textura fina y enfría al menos 2 horas.", "Sirve frío con {serrano} en taquitos por encima."], "Salmorejo cordobés": ["Cuece {huevos} 10 minutos, enfría y pela.", "Tritura {tomate} con {pan} desmigado, {ajo} y sal hasta obtener una crema espesa.", "Con la batidora en marcha, añade {aceite} en hilo para emulsionar. Enfría 2 horas.", "Sirve con el huevo duro picado y {serrano} por encima."], "Sopa de ajo castellana": ["Corta {pan} en láminas y dóralas en una cazuela con {aceite}.", "Añade {ajo} laminado 30 segundos y {serrano} en tiras.", "Vierte {caldo} caliente y cuece 10 minutos.", "Casca {huevos} en la sopa, tapa y deja 3-4 minutos hasta que la clara cuaje del todo."], "Huevos rotos con jamón y patatas": ["Pela {patata} y córtala en bastones; fríela en {aceite} a fuego medio hasta que esté dorada y tierna. Escurre.", "Fríe {huevos} con la yema cuajada.", "Coloca los huevos sobre las patatas, rómpelos y reparte {serrano} encima."], "Croquetas caseras de jamón": ["Pocha {cebolla} muy picada con {aceite} 5 minutos, añade {serrano} picado.", "Incorpora {harina} y tuéstala 1 minuto; vierte {leche} poco a poco removiendo hasta formar una masa espesa y sazona.", "Enfría la masa al menos 2 horas, forma croquetas y pásalas por {huevos} batido y {panrallado}.", "Fríelas en abundante aceite caliente hasta que estén doradas y sirve con ensalada de {lechuga}."], "Escalivada con anchoas": ["Precalienta el horno a 200 °C. Pon {berenjena}, {pimiento}, {cebolla} y {tomate} enteros en una bandeja con {aceite}.", "Hornea 40-45 minutos, dando la vuelta una vez, hasta que estén tiernos.", "Pela las verduras templadas y córtalas en tiras.", "Sirve aliñadas con aceite y sal, con {anchoas} por encima y {pan} tostado."], "Ensaladilla rusa": ["Cuece {patata}, {zanahoria} y {huevos} (10 minutos) en agua con sal; añade {guisantes} los últimos 3 minutos.", "Enfría, pela y corta todo en dados pequeños.", "Mezcla con {atun} escurrido y {mayonesa}.", "Sirve fría, decorada con {aceitunas}."], "Tortilla de calabacín y cebolla": ["Corta {calabacin} y {cebolla} en dados pequeños.", "Pocha con {aceite} 12-15 minutos a fuego medio-bajo.", "Bate {huevos} con sal, mezcla con las verduras escurridas y cuaja 3-4 minutos por lado.", "Sirve con ensalada de {tomate}."], "Tortilla de espinacas y queso": ["Saltea {espinacas} con un poco de {aceite} 2 minutos y escurre el exceso de agua.", "Bate {huevos} con sal, añade las espinacas y {queso}.", "Cuaja en una sartén 3-4 minutos por lado.", "Sirve con {pan}."], "Revuelto de espárragos y gambas": ["Corta {esparragos} en trozos de 2 cm, descartando la parte dura.", "Dora {ajo} laminado en {aceite}, añade los espárragos y saltea 4 minutos.", "Agrega {gambas} descongeladas y secas, y cocina 2 minutos.", "Añade {huevos} batidos y remueve a fuego bajo hasta que cuajen."], "Tosta de piquillos y anchoas": ["Corta {pan} en rebanadas y tuéstalas.", "Coloca encima {piquillo} escurridos y {mozzarella}.", "Añade {anchoas} y un hilo de {aceite}. Gratina 2-3 minutos si quieres que se funda el queso."], "Ensalada de pasta mediterránea": ["Cuece {pasta} según el paquete, escurre y enfría bajo el grifo.", "Corta {tomate} y {pepino} en dados.", "Mezcla todo con {aceitunas} y {feta} desmenuzado.", "Aliña con {aceite} y sal."], "Berenjenas gratinadas con mozzarella": ["Precalienta el horno a 200 °C. Corta {berenjena} en rodajas de 1 cm y hornéalas con {aceite} y sal 15 minutos.", "Cubre con {ttritu} y {mozzarella}.", "Gratina 10 minutos."], "Pizza casera de verduras": ["Mezcla {harina} con agua tibia (aprox. 55 ml por 100 g), sal y un chorrito de {aceite}; amasa 8 minutos y deja reposar 20 minutos.", "Precalienta el horno a 220 °C. Estira la masa fina sobre una bandeja.", "Extiende {ttritu}, cubre con {mozzarella}, {champis} laminados, {pimiento} y {cebolla} en tiras.", "Hornea 12-15 minutos."], "Pizza casera de jamón y queso": ["Mezcla {harina} con agua tibia (aprox. 55 ml por 100 g), sal y un chorrito de {aceite}; amasa 8 minutos y deja reposar 20 minutos.", "Precalienta el horno a 220 °C. Estira la masa fina sobre una bandeja.", "Extiende {ttritu}, cubre con {mozzarella} y {jamon}.", "Hornea 12-15 minutos."], "Pollo a la plancha con ensalada griega": ["Aplana {pechuga} en filetes finos, sazona y hazla en una plancha con unas gotas de {aceite}, 3-4 minutos por lado, hasta que no quede rosada por dentro.", "Corta {pepino} y {tomate} en dados y mezcla con {aceitunas} y {feta} desmenuzado.", "Aliña con aceite y sal y sirve con el pollo."], "Sopa de fideos con pollo": ["Pela {zanahoria} y {patata} y córtalas en dados pequeños. Trocea {muslo} sin piel.", "Calienta {caldo} con {aceite}, añade el pollo, la zanahoria y la patata; cuece 15 minutos.", "Retira el pollo, desmenúzalo y devuélvelo a la sopa.", "Añade {fideos} y cuece 5 minutos más."], "Crema de puerros y patata": ["Limpia {puerro} y córtalo en rodajas; pela {patata} en trozos.", "Rehoga el puerro con {aceite} 5 minutos, añade la patata y cubre con agua y sal.", "Cuece 20 minutos y tritura con {nata}.", "Sirve con {pan} tostado."], "Bocadillo de tortilla de patatas": ["Pela {patata} en láminas y pocha con {cebolla} y {aceite} 15-20 minutos.", "Bate {huevos}, mezcla con las patatas y cuaja bien por los dos lados.", "Abre {pan} y rellena con la tortilla templada."], "Avena con manzana y plátano": ["Pon {avena} en un cazo con el doble de agua y cuece 4-5 minutos a fuego bajo, removiendo.", "Corta {manzana} en dados pequeños y {platano} en rodajas.", "Sirve las gachas con la fruta por encima."], "Macedonia de naranja y plátano con avena": ["Pela {naranja} y sepárala en gajos; corta {platano} en rodajas.", "Mezcla la fruta con el jugo que suelte la naranja.", "Espolvorea {avena} por encima."], "Tostada de piquillos y aceite": ["Tuesta {pan}.", "Escurre {piquillo} y colócalos encima.", "Riega con {aceite} y una pizca de sal."], "Yogur con plátano y avena": ["Corta {platano} en rodajas.", "Pon {yogur} en un bol con el plátano y espolvorea {avena}."], "Huevos revueltos con tostada": ["Bate {huevos} con sal.", "Cuájalos en una sartén con {aceite} a fuego bajo, removiendo, hasta que no quede parte líquida.", "Tuesta {pan} y sirve."], "Lentejas con arroz y verduras": ["Pica {cebolla} y {pimiento}; pela {zanahoria} y córtala en dados.", "Sofríe cebolla y pimiento con {aceite} 5 minutos y añade {tfrito}.", "Agrega la zanahoria, {lentejas} lavadas y agua fría hasta cubrir; cuece 20 minutos.", "Añade {arroz} y sal, y cuece 18 minutos más, hasta que el arroz esté tierno; añade agua caliente si hace falta."], "Potaje de garbanzos con judías verdes": ["Limpia y corta {judias}; pela {patata} en dados y pica {cebolla}.", "Sofríe la cebolla con {aceite}, añade {tfrito} y cuece 2 minutos.", "Incorpora las judías, la patata y agua hasta cubrir; cuece 15 minutos.", "Añade {garbanzos} escurridos y sal, y cuece 10 minutos más."], "Alubias estofadas con calabaza": ["Pela {calabaza} y córtala en dados; pica {cebolla} y {pimiento}.", "Sofríe cebolla y pimiento con {aceite} 5 minutos, añade {ttritu} y cuece 5 minutos.", "Agrega la calabaza y un vaso de agua; cuece 10 minutos.", "Añade {alubias} escurridas y cuece 10 minutos más."], "Arroz de verduras": ["Corta {pimiento} y {zanahoria} en dados pequeños.", "Sofríelos con {aceite} 6 minutos y añade {ttritu} /* ---------- Sincronización en vivo entre dispositivos (solo en la versión web con base de datos) ---------- */
var CLIENT=Math.random().toString(36).slice(2,10),dref=null,writing=false,pending=false,wTimer=null,readOnly=false;

  var el=document.querySelector("#status");if(!el)return;
  el.className="status"+(st==="on"?" on":(st==="error"||st==="ro")?" bad":"");
  el.textContent=st==="on"?"Sincronizado en vivo":st==="error"?"Sin conexión con la nube":st==="ro"?"Solo lectura":"Solo en este dispositivo";
  SYNC=st;

var SYNC=null;
function pushRemote(){if(!dref||readOnly)return;clearTimeout(wTimer);wTimer=setTimeout(doPush,700);}
function doPush(){
  if(!dref||readOnly)return;
  if(writing){pending=true;return;}
  writing=true;
  dref.set({v:1,by:CLIENT,t:Date.now(),s:JSON.stringify(shared())}).then(function(){writing=false;if(SYNC!=="on")setSync("on");if(pending){pending=false;doPush();}},
    function(e){writing=false;pending=false;if(e&&e.code==="invalid_argument"){readOnly=true;setSync("ro");}else setSync("error");});
}
function applyRemote(r){
  var old=JSON.stringify(shared());
  fixIdx(r,r.rl);
  SHARED.forEach(function(k){if(r[k]!==undefined)S[k]=r[k];});
  S.rl=RR.length;
  S.styles=S.styles||{};S.goals=S.goals||{};

function initSync(){
  try{
    if(!window.claude||!window.claude.use)return;
    window.claude.use("db").then(function(db){
      if(!db){setSync(null);return;}
      dref=db.doc("state/main");var first=true;
      dref.onSnapshot(function(snap){
        if(!snap.exists){if(first){first=false;setSync("on");pushRemote();}return;}
        first=false;var d=snap.data();setSync("on");
        if(!d||d.by===CLIENT)return;
        try{var r=JSON.parse(d.s);if(r&&Array.isArray(r.plan))applyRemote(r);}catch(e){}
      },function(){setSync("error");});
    }).catch(function(){});
  }catch(e){}
}

/* ---------- Precios ---------- */
function hash(s){var x=0;for(var i=0;i<s.length;i++){x=(x*31+s.charCodeAt(i))>>>0;}return x;}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function price(sm,pid){
  var o=S.over[sm]&&S.over[sm][pid]; if(typeof o==="number")return o;
  var f=FEED[sm]&&FEED[sm][pid]; if(typeof f==="number"&&f>0)return f;
  return Math.round(PR[pid].price*MULT[sm]*(0.94+(hash(sm+pid)%13)/100)*100)/100;
}
function eur(n){return n.toLocaleString("es-ES",{minimumFractionDigits:2,maximumFractionDigits:2})+" €";}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function fq(q,u){
  if(u==="g"){if(q>=1000)return (Math.round(q/100)/10).toLocaleString("es-ES")+" kg";return (Math.round(q/5)*5||5)+" g";}
  if(u==="ml"){if(q>=1000)return (Math.round(q/100)/10).toLocaleString("es-ES")+" l";return (Math.round(q/5)*5||5)+" ml";}
  var n=Math.round(q*4)/4; if(n<0.25)n=0.25; return n.toLocaleString("es-ES")+" ud";
}
function packTxt(pid,packs){var p=PR[pid]; if(p.size===1&&p.u==="ud")return packs+" ud"; return packs+" × "+fq(p.size,p.u);}

/* Raciones respecto a un adulto: niños de 3 a 12 años ~75 %, menores de 3 ~50 % (estimación a partir de la tabla de raciones por edad) */
var KID=0.75,TOD=0.5;
function eq(){return S.people+(S.kids||0)*KID+(S.toddlers||0)*TOD;}
function diners(){return S.people+(S.kids||0)+(S.toddlers||0);}
function slots(plan){var o=[];plan.forEach(function(d,i){["b","c","d"].forEach(function(t){if(d[t]!=null)o.push([i,t,d[t]]);});});return o;}
function needMap(plan){
  var m={};slots(plan).forEach(function(s){var r=R[s[2]];for(var k in r.i){m[k]=(m[k]||0)+r.i[k]*eq();}});return m;
}
function lines(plan,sm){
  var need=needMap(plan),out=[],total=0;
  Object.keys(need).forEach(function(pid){
    var p=PR[pid],packs=Math.max(1,Math.ceil(need[pid]/p.size-1e-9)),pr=price(sm,pid),cost=packs*pr;
    total+=cost;out.push({pid:pid,need:need[pid],packs:packs,pr:pr,cost:cost});
  });
  return {out:out,total:total};
}
function unitCost(rid,sm){var r=R[rid],c=0;for(var k in r.i){c+=r.i[k]*price(sm,k)/PR[k].size;}return c;}
function total(plan,sm){return lines(plan,sm||S.sm).total;}

function okSlot(plan,day,t,rid){
  var cnt=0;plan.forEach(function(d){if(d[t]===rid)cnt++;});
  if(cnt>=(t==="b"?4:2))return false;
  var offs=t==="b"?[-1,1]:[-2,-1,1,2];
  for(var i=0;i<offs.length;i++){var nd=plan[day+offs[i]];if(nd&&nd[t]===rid)return false;}
  return true;
}
var SOFT=["rapido","prot","cuchara","calor","sano","equi"];
function softSel(){return SOFT.filter(function(k){return S.styles&&S.styles[k];});}
function matchN(r,ss){var c=0;ss.forEach(function(k){if(r.sty[k])c++;});return c;}
function pool(t){
  var ss=softSel(),cand=[];
  R.forEach(function(r,i){if(!r.del&&r.t===t&&(!S.veg||r.v)&&(!(S.styles&&S.styles.vegan)||r.vegan)&&(!(S.kids||S.toddlers)||!r.kidBad)&&(!S.toddlers||!(r.fry||r.proc||r.mar)))cand.push(i);});
  if(ss.length&&cand.length){
    var ms=cand.map(function(i){return matchN(R[i],ss);}),mx=Math.max.apply(null,ms);
    if(mx>0){
      var full=cand.filter(function(i,j){return ms[j]===ss.length;});
      if(t==="b"){var best=cand.filter(function(i,j){return ms[j]===mx;});cand=best.length>=3?best:cand.filter(function(i,j){return ms[j]>=1;});}
      else if(full.length>=5)cand=full;
      else cand=cand.filter(function(i,j){return ms[j]>=Math.max(1,mx-1);});
    }
  }
  var o=[];cand.forEach(function(i){o.push(i);if(isFav(R[i])){o.push(i);o.push(i);}});
  return o;
}

/* Secuencia de platos principales (comida y cena) en el orden en que se comen */
function seqOf(plan){var q=[];plan.forEach(function(d){["c","d"].forEach(function(t){if(d[t]!=null)q.push(d[t]);});});return q;}
function stats(q){
  var c={leg:0,pesc:0,az:0,carne:0,roja:0,proc:0,huevo:0,carb:0,patata:0,fry:0,tuna:0,lowveg:0,veg:0};
  q.forEach(function(id){var r=R[id];
    if(r.leg)c.leg++;if(r.pesc)c.pesc++;if(r.az)c.az++;if(r.meat)c.carne++;if(r.roja)c.roja++;if(r.proc)c.proc++;
    if(r.huevo)c.huevo++;if(r.carb)c.carb++;if(r.h==="patata")c.patata++;if(r.fry)c.fry++;if(r.tuna)c.tuna++;
    if(r.vegG<100)c.lowveg++;c.veg+=r.vegG;
  });
  return c;
}
/* Objetivos semanales para 14 platos (7 comidas + 7 cenas), escalados si hay menos */
function caps(n){
  var k=n/14;
  return {leg:Math.max(1,Math.round(4*k)),pesc:S.veg?0:Math.round(3*k),carne:Math.max(1,Math.round(3*k)),roja:1,
    proc:(S.kids||S.toddlers)?1:2,huevo:Math.max(1,Math.round(4*k)),carb:Math.max(1,Math.round(3*k)),patata:Math.max(1,Math.round(2*k)),fry:1};
}
function evalPlan(plan){
  var q=seqOf(plan),n=q.length,pen=0,j;
  if(!n)return 0;
  for(j=1;j<n;j++){
    var a=R[q[j-1]],b=R[q[j]];
    if(q[j]===q[j-1])pen+=60;
    if(a.f===b.f)pen+=a.f==="veg"?5:18;
    if(a.h&&a.h===b.h)pen+=30;
    if(a.carb&&b.carb)pen+=14;
    if(j>1){var z=R[q[j-2]];if(z.h&&z.h===b.h)pen+=8;if(z.f===b.f&&z.f!=="veg")pen+=5;}
  }
  var st=stats(q),cp=caps(n),ex=function(v,c,w){return v>c?w*(v-c):0;},lo=function(v,c,w){return v<c?w*(c-v):0;};
  var G=S.goals||{},gp=function(key,v,dflt){return typeof G[key]==="number"?30*Math.abs(v-Math.min(G[key],n)):dflt;};
  pen+=gp("leg",st.leg,lo(st.leg,cp.leg,26));
  if(!S.veg){
    pen+=gp("pesc",st.pesc,lo(st.pesc,cp.pesc,22));
    if(n>=7&&st.az<1&&(typeof G.pesc!=="number"||G.pesc>0))pen+=10;
    pen+=gp("carne",st.carne,ex(st.carne,cp.carne,22))+gp("roja",st.roja,ex(st.roja,cp.roja,22));
  }
  pen+=gp("proc",st.proc,ex(st.proc,cp.proc,16))+gp("carb",st.carb,ex(st.carb,cp.carb,14))+ex(st.patata,cp.patata,8)+gp("fry",st.fry,ex(st.fry,cp.fry,16));
  if(!(S.styles&&S.styles.vegan))pen+=gp("huevo",st.huevo,ex(st.huevo,cp.huevo,14));
  var ss=softSel();
  slots(plan).forEach(function(sl){
    var r=R[sl[2]];
    if(sl[1]==="c"&&r.kcal<HEART&&!r.leg&&!r.sty.cuchara)pen+=(HEART-r.kcal)/25;
    if(sl[1]==="d"&&r.kcal>HEAVY)pen+=(r.kcal-HEAVY)/40;
    if(ss.length&&sl[1]!=="b")pen+=(ss.length-matchN(r,ss))*9;
  });
  if(S.kids||S.toddlers)pen+=ex(st.tuna,1,35);
  if(S.toddlers){plan.forEach(function(d){if(d.c!=null&&d.d!=null&&R[d.c].spin&&R[d.d].spin)pen+=30;});}
  pen+=st.lowveg*6;
  q.forEach(function(id){if(isFav(R[id]))pen-=8;});
  return pen;
}
function planScore(plan){
  var t=total(plan,S.sm),over=Math.max(0,t-S.budget);
  return evalPlan(plan)+over*12+t*0.02;
}
function generate(){
  var rng=mulberry(S.seed),plan=[],d;
  for(d=0;d<7;d++)plan.push({b:null,c:null,d:null});
  ["b","c","d"].filter(function(t){return S.meals[t];}).forEach(function(t){
    var p=pool(t);
    for(var dd=0;dd<7;dd++){
      var cands=p.filter(function(r){return okSlot(plan,dd,t,r);});
      if(!cands.length)cands=p;
      plan[dd][t]=cands[Math.floor(rng()*cands.length)];
    }
  });
  var cd=[];
  plan.forEach(function(_,dd){["c","d"].forEach(function(t){if(plan[dd][t]!=null)cd.push([dd,t]);});});
  var cur=planScore(plan);
  for(var it=0;it<3200&&cd.length;it++){
    var s0=cd[Math.floor(rng()*cd.length)],dy=s0[0],tt=s0[1],old=plan[dy][tt];
    plan[dy][tt]=null;
    var cs=pool(tt).filter(function(r){return r!==old&&okSlot(plan,dy,tt,r);});
    if(!cs.length){plan[dy][tt]=old;continue;}
    plan[dy][tt]=cs[Math.floor(rng()*cs.length)];
    var sc=planScore(plan);
    if(sc<=cur)cur=sc;else plan[dy][tt]=old;
  }
  S.plan=plan;
}
function planValid(){
  if(!Array.isArray(S.plan)||S.plan.length!==7)return false;
  return S.plan.every(function(d){return d&&["b","c","d"].every(function(t){return d[t]==null||(typeof d[t]==="number"&&R[d[t]]&&!R[d[t]].del&&R[d[t]].t===t);});});
}

/* ---------- Lectura de recetas desde un enlace ---------- */
function plain(str){return new DOMParser().parseFromString(String(str||""),"text/html").body.textContent.replace(/\s+/g," ").trim();}
function findRecipe(j){
  if(!j)return null;
  if(Array.isArray(j)){for(var i=0;i<j.length;i++){var r=findRecipe(j[i]);if(r)return r;}return null;}
  if(typeof j!=="object")return null;
  var t=j["@type"];
  if(t&&(t==="Recipe"||(Array.isArray(t)&&t.indexOf("Recipe")>=0)))return j;
  if(j["@graph"])return findRecipe(j["@graph"]);
  return null;
}
function flatSteps(x){
  var o=[];
  (function walk(v){
    if(!v)return;
    if(typeof v==="string"){v.split(/\n+/).forEach(function(t){t=plain(t);if(t)o.push(t);});return;}
    if(Array.isArray(v)){v.forEach(walk);return;}
    if(v.itemListElement)walk(v.itemListElement);else if(v.text)walk(v.text);else if(v.name)walk(v.name);
  })(x);
  return o;
}
function isoMin(s){var m=/PT(?:(\d+)H)?(?:(\d+)M)?/i.exec(String(s||""));if(!m)return 0;return (+m[1]||0)*60+(+m[2]||0);}
function recipeFromHtml(html,src){
  var doc=new DOMParser().parseFromString(html,"text/html"),found=null;
  var sc=doc.querySelectorAll('script[type="application/ld+json"]');
  for(var i=0;i<sc.length&&!found;i++){var j;try{j=JSON.parse(sc[i].textContent);}catch(e){continue;}found=findRecipe(j);}
  if(!found)return null;
  var y=found.recipeYield;if(Array.isArray(y))y=y[0];
  var ny=parseInt(String(y||"").replace(/[^\d]/g," ").trim().split(" ")[0],10)||2;
  var ing=(found.recipeIngredient||found.ingredients||[]).map(plain).filter(Boolean);
  return {n:plain(found.name),min:isoMin(found.totalTime)||(isoMin(found.cookTime)+isoMin(found.prepTime))||0,ny:ny,ing:ing,steps:flatSteps(found.recipeInstructions),src:src};
}
function parseText(t){
  var L=String(t).split(/\r?\n/).map(function(x){return x.trim();}).filter(Boolean),ing=[],st=[],mode=0,title="";
  L.forEach(function(l){
    if(/^ingredientes\b/i.test(l)){mode=1;return;}
    if(/^(preparaci[oó]n|elaboraci[oó]n|pasos|instrucciones|modo de preparaci[oó]n)\b/i.test(l)){mode=2;return;}
    if(mode===1)ing.push(l.replace(/^[-•*·]\s*/,""));
    else if(mode===2)st.push(l.replace(/^(\d+[.)]|paso\s*\d+[:.]?)\s*/i,""));
    else if(!title)title=l;
  });
  return {n:title,ing:ing,steps:st,ny:2,min:0,src:""};
}
function fetchText(url){
  return new Promise(function(ok,ko){
    var done=false,tm=setTimeout(function(){if(!done){done=true;ko(new Error("timeout"));}},12000);
    fetch(url).then(function(r){if(!r.ok)throw new Error("http");return r.text();}).then(function(x){if(!done){done=true;clearTimeout(tm);ok(x);}},function(e){if(!done){done=true;clearTimeout(tm);ko(e);}});
  });
}
function fetchPage(url){
  var tries=[url,"https://api.allorigins.win/raw?url="+encodeURIComponent(url),"https://corsproxy.io/?url="+encodeURIComponent(url)];
  return tries.reduce(function(p,u){return p.catch(function(){return fetchText(u).then(function(h){if(h.length<200)throw new Error("short");return h;});});},Promise.reject(new Error("start")));
}

    var fr=R[+b.dataset.r];if(!fr)return;
    if(S.favs[fr.n])delete S.favs[fr.n];else S.favs[fr.n]=1;
    save();render();toast(S.favs[fr.n]?"Añadida a favoritas. Se tendrá en cuenta al crear menús.":"Quitada de favoritas");return;
  }
  if(act==="rnew"){recEd=newDraft();render();window.scrollTo(0,0);return;}
  if(act==="redit"){var er=R[+b.dataset.r];if(er&&er.cu!=null){recEd=draftFromCustom(S.custom[er.cu]);render();window.scrollTo(0,0);}return;}
  if(act==="rdel"){
    var dr=R[+b.dataset.r];if(!dr||dr.cu==null)return;
    S.custom[dr.cu].del=true;rebuildR();delete S.favs[dr.n];
    if(!planValid())generate();
    save();render();toast("Receta eliminada");return;
  }
  if(act==="rcancel"){recEd=null;render();return;}
  if(act==="radd"){recEd.rows.push(blankRow());render();return;}
  if(act==="rrm"){recEd.rows.splice(+b.dataset.i,1);if(!recEd.rows.length)recEd.rows.push(blankRow());render();return;}
  if(act==="rsave"){var er2=saveDraft();if(er2)toast(er2);else toast("Receta guardada");return;}
  if(act==="rparse"){
    var pt=parseText(recEd.paste||"");
    if(!pt.ing.length){recEd.msg="No encuentro la lista de ingredientes. Pon una línea «Ingredientes» antes y «Preparación» antes de los pasos.";render();return;}
    applyImported(recEd,pt);recEd.msg="Texto leído. Revisa los productos de cada ingrediente.";render();return;
  }
  if(act==="rimport"){
    var url=String(recEd.url||"").trim();
    if(!/^https?:\/\//i.test(url)){recEd.msg="Pega un enlace que empiece por http:// o https://";render();return;}
    recEd.busy=true;render();
    var d0=recEd;
    fetchPage(url).then(function(html){
      var rr=recipeFromHtml(html,url);
      if(!rr||!rr.ing.length){d0.busy=false;d0.msg="La página no trae la receta en un formato que pueda leer. Pega el texto de la receta en el cuadro de abajo.";}
      else{d0.busy=false;applyImported(d0,rr);d0.msg="Receta leída. Revisa los productos y las cantidades antes de guardar.";}
    },function(){d0.busy=false;d0.msg="No he podido abrir esa página desde aquí. Pega el texto de la receta en el cuadro de abajo.";}).then(function(){if(recEd===d0&&S.tab==="recetas")render();});
    return;
  }

  if(act==="rt"){recT=b.dataset.t;render();return;}
  if(act==="goreceta"){recOpen=+b.dataset.r;recQ="";recT="all";S.tab="recetas";save(true);render();var el0=document.getElementById("rc-"+recOpen);if(el0)el0.scrollIntoView({block:"start"});return;}
  if(act==="swap"){
    var d=+b.dataset.d,t2=b.dataset.t,old=S.plan[d][t2];S.plan[d][t2]=null;
    var c=pool(t2).filter(function(r){return r!==old&&okSlot(S.plan,d,t2,r);});
    if(!c.length){S.plan[d][t2]=old;toast("No hay más opciones para este hueco");return;}
    var pick;
    if(t2==="b"){pick=c[Math.floor(Math.random()*c.length)];}
    else{var sc=c.map(function(r){S.plan[d][t2]=r;return {r:r,s:planScore(S.plan)};}).sort(function(a,b){return a.s-b.s;});pick=sc[Math.floor(Math.random()*Math.min(4,sc.length))].r;}
    S.plan[d][t2]=pick;save();render();return;
  }
  if(act==="usesm"){S.sm=b.dataset.sm;save();render();toast("Ahora compras en "+S.sm);return;}
  if(act==="uncheck"){S.done={};save();render();return;}
  if(act==="copy"){
    var txt=window.__listTxt;
    copyText(txt,"Lista copiada",function(){var ta=$("#fallback");ta.hidden=false;ta.value=txt;ta.focus();ta.select();toast("Selecciona y copia el texto");});
    return;
  }
  if(act==="import"){
    var ta2=$("#imp");impText=ta2.value;
    if(!impText.trim()){toast("Pega primero tus precios");return;}
    var r=importPrices(impText);save();
    toast(r.hit+" precios aplicados"+(r.miss?" · "+r.miss+" sin reconocer":""));
    if(r.hit)impText="";render();return;
  }
  if(act==="resetp"){delete S.over[S.sm];save();render();toast("Precios de "+S.sm+" restablecidos");return;}
  if(act==="tpl"){
    var tp=Object.keys(PR).map(function(k){return PR[k].name+";"+price(S.sm,k).toFixed(2).replace(".",",");}).join("\n");
    copyText(tp,"Plantilla copiada",function(){var ta=$("#imp");ta.value=tp;impText=tp;toast("Plantilla puesta en el cuadro");});
    return;
  }
  if(act==="codecopy"){
    var code=encodeState();
    copyText(code,"Código copiado",function(){var ta=$("#code");ta.value=code;codeText=code;ta.focus();ta.select();toast("Selecciona y copia el código");});
    return;
  }
  if(act==="codeload"){
    var cv=$("#code").value;codeText=cv;
    if(!cv.trim()){toast("Pega primero el código");return;}
    try{
      var o=decodeState(cv),keep=S.plan;
      fixIdx(o,o.rl);
      SHARED.forEach(function(k){if(o[k]!==undefined)S[k]=o[k];});
      S.rl=RR.length;S.styles=S.styles||{};S.goals=S.goals||{};
      rebuildR();
      if(!planValid()){S.plan=keep;toast("El código no es válido");return;}
      codeText="";save();render();toast("Menú cargado");
    }catch(err){toast("El código no es válido");}
    return;
  }
});
document.addEventListener("change",function(e){
  var el=e.target;
  if(el.id==="scanin"){var sf=el.files&&el.files[0];el.value="";startScan(sf);return;}
  if(el.dataset&&el.dataset.sc&&scan){scan[el.dataset.sc]=el.value;if(el.dataset.sc==="pid")render();return;}
  if(el.dataset&&el.dataset.f&&recEd){if(el.dataset.f==="pid"||el.dataset.f==="u")render();return;}
  if(el.dataset&&el.dataset.ed&&recEd){return;}
  if(el.id==="sm"){S.sm=el.value;save();render();return;}
  if(el.id==="cp"){var z=el.value.trim();if(/^\d{5}$/.test(z)){S.cp=z;save();render();}else{el.value=S.cp;toast("El código postal tiene 5 cifras");}return;}
  if(el.id==="budget"){var v=parseFloat(el.value);if(v>=10){S.budget=v;regen();}else{el.value=S.budget;}return;}
  if(el.dataset&&el.dataset.done){
    if(el.checked){S.done[el.dataset.done]=true;var ln=el.closest(".line");if(ln)ln.classList.add("done");save();setTimeout(function(){if(S.tab==="lista")render();},400);}
    else{delete S.done[el.dataset.done];save();render();}
    return;}
  if(el.dataset&&el.dataset.pid){
    var p=parseFloat(el.value);if(!(p>0)){render();return;}
    S.over[S.sm]=S.over[S.sm]||{};S.over[S.sm][el.dataset.pid]=Math.round(p*100)/100;save();render();return;
  }
});
document.addEventListener("input",function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.ed&&recEd){recEd[t.dataset.ed]=t.type==="checkbox"?t.checked:t.value;return;}
  if(t.dataset&&t.dataset.f&&recEd){var rw=t.closest("[data-row]");if(rw&&recEd.rows[+rw.dataset.row])recEd.rows[+rw.dataset.row][t.dataset.f]=t.value;return;}
  if(t.dataset&&t.dataset.sc&&scan){scan[t.dataset.sc]=t.value;return;}if(e.target.id==="rq"){recQ=e.target.value;var rl=$("#rlist");if(rl)rl.innerHTML=recList();return;}if(e.target.id==="imp")impText=e.target.value;if(e.target.id==="code")codeText=e.target.value;});

S=load();
rebuildR();
applySkin(getSkin(),true);
$("#sm").innerHTML=SUPERS.map(function(s){return '<option value="'+s+'">'+s+'</option>';}).join("");
if(SUPERS.indexOf(S.sm)<0)S.sm="Mercadona";
if(!planValid()){generate();save(true);}
render();
initSync();
/* Precios cargados desde un archivo precios.json publicado junto a la página (opcional) */
try{
  fetch(((window.LACESTA||{}).preciosUrl)||"precios.json",{cache:"no-store"}).then(function(r){return r.ok?r.json():null;}).then(function(j){
    if(j&&j.precios&&typeof j.precios==="object"){FEED=j.precios;FEEDMETA=j.meta&&j.meta.fecha?j.meta:null;render();}
  }).catch(function(){});
}catch(e){}
})();
</script>
